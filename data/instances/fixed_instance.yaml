objective:
  type: "strict_lexicographic"
  components:
    - total_flow_time
    - total_reconfiguration_cost
    - worker_reconfiguration_load_variance
  numerical_tolerances:
    total_flow_time: 0.000001
    total_reconfiguration_cost: 0.000001
    worker_reconfiguration_load_variance: 0.000001

truncation:
  incomplete_solution_ranks_after_complete_solution: true
  unfinished_order_penalty_per_order: 240.0
  record_censored_flow_time: true
  record_incurred_reconfiguration_cost: true
